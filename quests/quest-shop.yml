schemaVersion: 1
id: quest-shop-onboarding
title: Quest Shop Onboarding
description: Learn a tiny commerce API by completing verified missions.
missions:
  - id: boot-the-shop
    title: Boot the Shop
    objective: Run the fixture test suite and confirm the repository is healthy.
    concept: Project setup
    difficulty: beginner
    estimatedMinutes: 3
    hints:
      - Start with the package.json scripts instead of opening every source file.
      - A green baseline tells you the repository is ready for a first contribution.
    tags: [setup, tests]
    validation:
      baseline:
        executable: node
        args: [tests/run-tests.js]
        cwd: .
        timeoutMs: 5000
      solver:
        executable: node
        args: [tests/run-tests.js]
        cwd: .
        timeoutMs: 5000
      verifier:
        executable: node
        args: [tests/run-tests.js]
        cwd: .
        timeoutMs: 5000
  - id: trace-login-flow
    title: Follow the Login Flow
    objective: Trace a login request from the route into the authentication service.
    concept: Runtime navigation
    difficulty: beginner
    estimatedMinutes: 8
    hints:
      - Where does a POST /login request first enter the application?
      - Follow the function call until you find the service that checks credentials.
    tags: [navigation, runtime]
    validation:
      baseline:
        executable: node
        args: [scripts/trace-login.js]
        cwd: .
        timeoutMs: 5000
      solver:
        executable: node
        args: [scripts/trace-login.js]
        cwd: .
        timeoutMs: 5000
      verifier:
        executable: node
        args: [scripts/trace-login.js]
        cwd: .
        timeoutMs: 5000
  - id: fix-invalid-login
    title: Fix Invalid Login
    objective: Make unknown users receive a safe 401 response instead of crashing.
    concept: Error handling
    difficulty: intermediate
    estimatedMinutes: 12
    hints:
      - Compare the unknown-user branch with the wrong-password branch.
      - The verifier cares about the HTTP status, not a new authentication system.
    tags: [debugging, mutation]
    validation:
      baseline:
        executable: node
        args: [tests/invalid-login.js]
        cwd: .
        timeoutMs: 5000
      solver:
        executable: node
        args: [tests/invalid-login.js]
        cwd: .
        timeoutMs: 5000
      verifier:
        executable: node
        args: [tests/invalid-login.js]
        cwd: .
        timeoutMs: 5000
  - id: add-an-empty-cart-test
    title: Add an Empty Cart Test
    objective: Add a regression test for the empty-cart behavior.
    tags: [testing, contribution]
  - id: publish-your-first-quest
    title: Publish Your First Quest
    objective: Export the verified quest manifest and add its badge to the README.
    tags: [open-source, documentation]
